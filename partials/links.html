<script>
// в тексте поста ссылка на другой пост открывается в новой вкладке —
// читатель не теряет статью, которую читает. Лента постов, шапка и якоря не трогаются
if (location.pathname.includes("/posts/")) {
  document.querySelectorAll("#quarto-document-content a[href]").forEach(function (a) {
    if (a.closest(".quarto-listing, .csl-entry, .citation, #quarto-appendix")) return;
    var url = new URL(a.href, location.href);
    if (url.origin !== location.origin || !url.pathname.includes("/posts/")) return;
    if (!/(\/|\.html)$/.test(url.pathname)) return; // только страницы, не картинки для увеличения
    if (url.pathname === location.pathname) return;
    a.target = "_blank";
    a.rel = "noopener";
  });
}

// ссылки в списке источников (DOI и т.п.) открываются в новой вкладке;
// тултип источника копирует разметку отсюда, так что там тоже
document.querySelectorAll(".csl-entry a[href^='http']").forEach(function (a) {
  a.target = "_blank";
  a.rel = "noopener";
});

// ссылка на источник в тексте оформлена «таблеткой» — скобки вокруг неё лишние
document.querySelectorAll(".citation[data-cites]").forEach(function (c) {
  var first = c.firstChild, last = c.lastChild;
  if (first && first.nodeType === 3) first.textContent = first.textContent.replace(/^\(/, "");
  if (last && last.nodeType === 3) last.textContent = last.textContent.replace(/\)$/, "");
  // год не остаётся один на новой строке: «Seli 2015» переносится вместе
  c.querySelectorAll("a").forEach(function (a) {
    a.textContent = a.textContent.replace(/ (\d{4}[a-z]?)$/, " $1");
  });
});
</script>
